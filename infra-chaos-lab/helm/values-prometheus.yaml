# Prometheus Helm Values (Chart 29.48.0 / Prometheus v3.16.0) fuer 5s-Messaufloesung

server:
  retention: "24h"
  global:
    scrape_interval: 5s
    scrape_timeout: 4s
    evaluation_interval: 5s
  service:
    type: NodePort
    nodePort: 30090
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 48Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
