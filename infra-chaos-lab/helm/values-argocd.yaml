# ==============================================================================
# ArgoCD Helm Values für wissenschaftliches Messframework
# Optimiert für t3.small / t3.medium und sofortige Erreichbarkeit
# ==============================================================================

global:
  logging:
    format: json
    level: info

# Deaktiviere unbenötigte Sub-Komponenten zur maximalen RAM-Schonung
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

# ArgoCD API & Web Server
server:
  service:
    type: NodePort
    nodePortHttp: 30080
    ports:
      http: 80
  insecure: true # Deaktiviert TLS-Warnungen bei direktem IP/NodePort-Zugriff
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ArgoCD Application Controller (Zentraler Untersuchungsgegenstand der Arbeit)
controller:
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi # Definierter Schwellenwert für Resilienz- und OOM-Experimente

# ArgoCD Repo Server (Git-Klonen & Manifest-Generierung)
repoServer:
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# Redis Cache
redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
