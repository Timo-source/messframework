# ==============================================================================
# Grafana Helm Values fuer das Messframework
# Datasource und Dashboards werden beim Start automatisch provisioniert,
# damit nach jedem terraform apply nichts manuell eingerichtet werden muss.
# ==============================================================================

adminUser: admin
adminPassword: admin

service:
  type: NodePort
  nodePort: 30000

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 200m
    memory: 192Mi

# Prometheus als Default-Datasource (interne Cluster-Adresse, kein Public-IP noetig)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          timeInterval: 5s

# Dashboards kommen aus der ConfigMap "grafana-dashboards"
# (wird im Bootstrap aus infra-chaos-lab/grafana/*.json erzeugt)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: messframework
        orgId: 1
        folder: Messframework
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/messframework

dashboardsConfigMaps:
  messframework: grafana-dashboards
