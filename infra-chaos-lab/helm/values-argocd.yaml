# ArgoCD Helm Values (Chart 10.18.2 / ArgoCD v3.6.2) fuer ressourcenbeschränkte K3s-Umgebung

global:
  logging:
    format: json
    level: info

configs:
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: false

server:
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

controller:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  metrics:
    enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8084"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

redis:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
