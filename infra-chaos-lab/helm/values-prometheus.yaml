# ==============================================================================
# Prometheus Helm Values für schlankes, hochauflösendes Messframework
# Standalone Prometheus ohne CRD-Bloat – optimiert für t3.small (2 GB RAM)
# ==============================================================================

server:
  retention: "24h" # Ephemeres Arbeiten: 24h Speicher genügt vollkommen
  global:
    scrape_interval: 5s     # Wissenschaftliche Auflösung: 5 Sekunden
    scrape_timeout: 4s
    evaluation_interval: 5s
  service:
    type: NodePort
    nodePort: 30090
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

# Erfasst Kernel- & OS-Metriken (CPU, RAM, TCP Retransmissions für Störungsanalysen)
prometheus-node-exporter:
  enabled: true

# Erfasst Kubernetes-Objektzustände (PodRestarts, Pending, CrashLoopBackOff)
kube-state-metrics:
  enabled: true

# Deaktiviere ungenutzte Komponenten zur RAM-Schonung
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
