apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-workload-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # URL deines GitHub-Repos 'gitops-workloads'
    repoURL: 'https://github.com/<DEIN-GITHUB-USER>/gitops-workloads.git'
    targetRevision: HEAD
    path: base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: workloads
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
